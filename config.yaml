project:
  name: "Northgate AI Stock Predictor"
  random_seed: 42
  timezone: "America/New_York"

data:
  # Yahoo Finance end date is exclusive. 2026-10-31 includes data through
  # the last available trading session before this date.
  start_date: "2015-01-01"
  end_date: "2026-10-31"
  equity_universe:
    - "AAPL"
    - "MSFT"
    - "JPM"
    - "XOM"
    - "JNJ"
    - "PG"
    - "NVDA"
    - "KO"
    - "CAT"
    - "HD"
  benchmark: "^GSPC"
  volatility_index: "^VIX"
  fred_series:
    - "DGS10"
    - "DGS3MO"
    - "CPIAUCSL"
    - "UNRATE"

modeling:
  target: "next_day_log_return"
  sequence_length: 60
  forecast_horizons:
    - 1
    - 5
    - 21
  test_fraction: 0.20
  validation_splits: 5

portfolio:
  risk_free_rate: 0.04
  max_asset_weight: 0.30
  monte_carlo_portfolios: 20000

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  models: "models"
  reports: "reports"
  figures: "reports/figures"
